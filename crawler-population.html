const svg = document.querySelector('svg'), tip = document.getElementById('tip');
const g = D.geom, ns='http://www.w3.org/2000/svg', PW = g.W-g.ML-g.MR;
let zt0 = 0, zt1 = g.tmax;
// Level-panel series toggles: Carl & Donut shown by default, everyone else off.
const LEVEL_ON = {'Carl': true, 'Donut': true};
const levelNames = () => [...new Set(D.levels.map(l => l.crawler))];
const isOn = n => LEVEL_ON[n] === true;
const X  = t => g.ML + (t-zt0)/(zt1-zt0)*PW;
const TP = px => zt0 + (px-g.ML)/PW*(zt1-zt0);
const l0 = Math.log10(g.ymin), l1 = Math.log10(g.ymax);
const Y  = c => g.POP_T + (l1-Math.log10(Math.max(c,g.ymin)))/(l1-l0)*(g.POP_B-g.POP_T);
const vl0 = Math.log10(g.vymin), vl1 = Math.log10(g.vymax);
const VY = c => (!c||c<=0) ? g.VIEW_B : g.VIEW_T + (vl1-Math.log10(Math.max(c,g.vymin)))/(vl1-vl0)*(g.VIEW_B-g.VIEW_T);
const LY = l => g.LEV_B - l/g.levmax*(g.LEV_B-g.LEV_T);
const fmt  = n => Math.round(n).toLocaleString('en-US');
const escH = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const dur = h => {let m=Math.round(h*60),d=Math.floor(m/1440);m-=d*1440;const hh=Math.floor(m/60),mm=m%60;
  return [d?d+'d':'',(hh||!d)?hh+'h':'',mm?mm+'m':''].filter(Boolean).join(' ');};
function mkTip(lines){return lines.map(escH).join('<br>');}
function short(n){const u=[[1e24,'Sp'],[1e21,'Sx'],[1e18,'Qi'],[1e15,'Qa'],[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'k']];
  for(const [v,s] of u) if(n>=v) return (n/v).toLocaleString('en-US',{maximumFractionDigits:3})+s;
  return String(n);}
function floorAt(t){return D.floors.find(f=>t>=f.start&&t<f.end)||D.floors[D.floors.length-1];}
function stairsTxt(f,t){
  const so=f.stairs_open!=null?f.stairs_open:f.start, ns=f.end-6;
  if(t<so) return dur(so-t)+' until stairs open';
  if(t<ns) return 'Stairs open ('+dur(ns-t)+' to 6h no-stasis window)';
  return 'Open (6h no-stasis window: '+dur(f.end-t)+' left)';
}
function at(t, floor){
  let f = floor!=null ? D.floors.find(f=>f.num==floor) : floorAt(t);
  if(!f || t<f.start || t>f.end) return null;
  const s = f.samples;
  let i = Math.max(0, Math.min(s.length-2, Math.floor((t-s[0][0])/D.step)));
  const a=s[i], b=s[i+1], k=(t-a[0])/(b[0]-a[0]);
  const L=(u,v)=>Math.exp(Math.log(u)+k*(Math.log(v)-Math.log(u)));
  return {f, t, c:L(a[1],b[1]), lo:L(a[2],b[2]), hi:L(a[3],b[3]), extrap: f.tail_from!=null && t>f.tail_from};
}
function parseDur(s){s=s.trim(); if(/^\d+(\.\d+)?$/.test(s)) return +s; let tot=0,ok=false;
  s.replace(/(\d+(?:\.\d+)?)\s*(d|h|m)[a-z]*/gi,(_,n,u)=>{ok=true;u=u.toLowerCase();tot+=n*(u=='d'?24:u=='h'?1:1/60);});
  return ok?tot:NaN;}
function E(tag, attrs, txt){const e=document.createElementNS(ns,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]); if(txt!=null) e.textContent=txt; return e;}
function tipify(el, text){el.classList.add('anchor');
  el.dataset.tip=Array.isArray(text)?mkTip(text):mkTip(text.split('\n'));
  el.style.cursor='help'; return el;}
function slots(){const boxes=[];return{
  fits(x0,x1,y){return !boxes.some(b=>Math.abs(b.y-y)<13 && x0<b.x1 && b.x0<x1);},
  take(x0,x1,y){boxes.push({x0,x1,y});},
  place(x0,x1,ys){for(const y of ys){if(this.fits(x0,x1,y)){this.take(x0,x1,y);return y;}}return null;}
};}

let vline, vdot, selRect, bandSlots = null;
function renderAll(){
  svg.innerHTML='';
  const st=E('style'); st.textContent='.lbl{fill:#444}.grid{stroke:#ddd;stroke-width:1}.anchor:hover{r:7}';
  svg.append(st);
  bandSlots=slots();
  drawTitles(); drawBands(); drawYGrid(); drawTimeGrid(); drawPopCurves(); drawCollapses();
  drawViewPanel(); drawLevelPanel(); drawPopAnchors(); drawLegends(); makeHoverLayer(); renderKey();
}
function renderKey(){
  const bar=document.getElementById('keybtns'); if(!bar) return;
  bar.innerHTML='';
  levelNames().forEach((name,i)=>{
    const col=D.colors[i%D.colors.length], on=isOn(name);
    const chip=document.createElement('button');
    chip.type='button'; chip.className='keychip'+(on?' on':'');
    const sw=document.createElement('i'); sw.style.background=col;
    sw.style.opacity=on?'1':'.3';
    const tx=document.createElement('span'); tx.textContent=name;
    chip.append(sw,tx);
    chip.onclick=()=>{LEVEL_ON[name]=!isOn(name); renderAll();};
    bar.append(chip);});
}
function keyAll(on){levelNames().forEach(n=>LEVEL_ON[n]=on); renderAll();}
function keyReset(){levelNames().forEach(n=>LEVEL_ON[n]=(n=='Carl'||n=='Donut')); renderAll();}
function drawTitles(){
  svg.append(E('text',{x:g.W/2,y:26,'text-anchor':'middle','font-size':18,'font-weight':600},
    'Dungeon Crawler World: Earth — Crawler Population, Viewership & Levels vs. Time'));
  svg.append(E('text',{x:g.W/2,y:46,'text-anchor':'middle','class':'lbl'},
    'Hours since T0 (the Collapse). Population & viewership: log scale. Hover points for details; drag to zoom.'));
}
function drawBands(){
  const ls=slots();
  D.floors.forEach((f,i)=>{
    const x0=X(f.start), x1=X(f.end), w=Math.max(x1-x0,1.5), bg=i%2?'#fbfaf4':'#f4f6fb';
    [[g.POP_T,g.POP_B],[g.VIEW_T,g.VIEW_B],[g.LEV_T,g.LEV_B]].forEach(([a,b])=>
      svg.append(E('rect',{x:x0,y:a,width:w,height:b-a,fill:bg})));
    if(x1-x0<30){
      [[g.POP_T,g.POP_B],[g.VIEW_T,g.VIEW_B],[g.LEV_T,g.LEV_B]].forEach(([a,b])=>{
          svg.append(tipify(E('line',{x1:x0,x2:x0,y1:a,y2:b,stroke:'#8e44ad','stroke-width':1.5,'stroke-dasharray':'3,2'}),
            `Floor ${f.num}: ${dur(f.end-f.start)} (shattered by Prepotente)`));});
      const flbl=`F${f.num} (${dur(f.end-f.start)})`;
      const yF=bandSlots.place(x0+4, x0+4+flbl.length*3.0, [g.POP_T+116, g.POP_T+130, g.POP_T+150]);
      if(yF!=null) svg.append(E('text',{x:x0+4,y:yF,'text-anchor':'start','font-size':10,'font-weight':600,fill:'#8e44ad'},flbl));
      return;
    }
    const cxp=(x0+x1)/2, nm=`Floor ${f.num}`;
    const yN=bandSlots.place(cxp-nm.length*3.4, cxp+nm.length*3.4, [16,52,88,34,70].map(d=>g.POP_T+d));
    if(yN!=null) svg.append(E('text',{x:cxp.toFixed(1),y:yN,'text-anchor':'middle','font-weight':600},nm));
    const dl=dur(f.end-f.start)+(f.status=='canon'?'':' (assumed)');
    const yD=bandSlots.place(cxp-dl.length*2.7, cxp+dl.length*2.7,
      (yN!=null?[yN+14]:[]).concat([30,66,102,48,84].map(d=>g.POP_T+d)));
    if(yD!=null) svg.append(E('text',{x:cxp.toFixed(1),y:yD,'text-anchor':'middle','class':'lbl'},dl));
    const yL=ls.place(cxp-nm.length*3.4, cxp+nm.length*3.4, [16,34,52].map(d=>g.LEV_T+d));
    if(yL!=null) svg.append(E('text',{x:cxp.toFixed(1),y:yL,'text-anchor':'middle','font-weight':600},nm));
  });
  drawStairs();
}
function drawStairs(){
  D.floors.forEach(f=>{
    if(f.stairs_open==null||!(f.start<f.stairs_open&&f.stairs_open<f.end)) return;
    const sx=X(f.stairs_open);
    [[g.POP_T,g.POP_B],[g.VIEW_T,g.VIEW_B],[g.LEV_T,g.LEV_B]].forEach(([a,b])=>{
      svg.append(tipify(E('line',{x1:sx,x2:sx,y1:a,y2:b,stroke:'#27ae60','stroke-width':1.5,'stroke-dasharray':'4,3'}),
        `Floor ${f.num+1} staircases populate at T0+${f.stairs_open}h (${dur(f.stairs_open)})`));});
    const w='stairs open'.length*2.7;
    const y=bandSlots.place(sx+4, sx+4+w,
      [g.POP_T+88,g.POP_T+102,g.POP_B-8,g.POP_T+16,g.POP_T+34,g.POP_T+52,g.POP_T+70]);
    if(y!=null) svg.append(E('text',{x:sx+4,y:y,'font-size':10,fill:'#27ae60'},'stairs open'));
  });
}
function drawYGrid(){
  for(let k=Math.floor(Math.log10(g.ymin)); Math.pow(10,k)<=g.ymax; k++)
    for(const m of [1,2,5]){const v=m*Math.pow(10,k);
      if(g.ymin<=v&&v<=g.ymax){const yy=Y(v);
        svg.append(E('line',{'class':'grid',x1:g.ML,x2:g.W-g.MR,y1:yy,y2:yy}));
        svg.append(E('text',{x:g.ML-8,y:yy+4,'text-anchor':'end','class':'lbl'},short(v)));}}
  svg.append(E('text',{transform:`translate(22,${(g.POP_T+g.POP_B)/2}) rotate(-90)`,'text-anchor':'middle'},'Crawlers remaining'));
}
function tStep(span){for(const s of [0.05,0.1,0.25,0.5,1,2,6,12,24,48,96,168,336,720]) if(span/s<=30) return s; return 1440;}
function drawTimeGrid(){
  const step=tStep(zt1-zt0), xw=PW/(zt1-zt0);
  const lblEvery=Math.max(1,Math.ceil(46/(xw*step))), dayEvery=Math.max(1,Math.ceil(70/(xw*24)));
  const ticks=[]; for(let t=Math.ceil(zt0/step-1e-9)*step; t<=zt1+1e-9; t+=step) ticks.push(t);
  const days=[]; for(let h=Math.ceil(zt0/24-1e-9)*24; h<=zt1+1e-9; h+=24) days.push(h);
  ticks.forEach(t=>{const xx=X(t);
    [[g.POP_T,g.POP_B],[g.VIEW_T,g.VIEW_B],[g.LEV_T,g.LEV_B]].forEach(([a,b])=>
      svg.append(E('line',{'class':'grid',x1:xx,x2:xx,y1:a,y2:b,'stroke-dasharray':'2,4'})));});
  days.forEach((h,i)=>{ if(i%dayEvery) return;
    const lbl=`d ${Math.round(h/24)+1}`, xx=X(h-12);
    svg.append(E('text',{x:xx,y:g.POP_B+32,'text-anchor':'middle','font-size':10,fill:'#888'},lbl));
    svg.append(E('text',{x:xx,y:g.VIEW_B+32,'text-anchor':'middle','font-size':10,fill:'#888'},lbl));});
  ticks.forEach((t,i)=>{ if(i%lblEvery) return;
    const lt=durationLabel(t), xx=X(t);
    svg.append(E('text',{x:xx,y:g.POP_B+16,'text-anchor':'middle','class':'lbl'},lt));
    svg.append(E('text',{x:xx,y:g.VIEW_B+16,'text-anchor':'middle','class':'lbl'},lt));
    svg.append(E('text',{x:xx,y:g.LEV_B+16,'text-anchor':'middle','class':'lbl'},lt));});
  svg.append(E('text',{x:(g.ML+g.W-g.MR)/2,y:g.H-12,'text-anchor':'middle'},'Hours since T0 (Collapse)'));
}
function durationLabel(t){return +(t.toFixed(2))+'h';}
function drawPopCurves(){
  D.floors.forEach(f=>{
    const s=f.samples;
    const seg=(p,dashd)=>{ if(p.length<2) return;
      const band=p.map(a=>[X(a[0]),Y(a[3])]).concat(p.slice().reverse().map(a=>[X(a[0]),Y(a[2])]));
      svg.append(E('polygon',{points:band.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '),
        fill:dashd?'#e8853b':'#4c78a8','fill-opacity':.18,stroke:'none'}));
      const at={points:p.map(a=>X(a[0]).toFixed(1)+','+Y(a[1]).toFixed(1)).join(' '),fill:'none',
        stroke:dashd?'#e8853b':'#4c78a8','stroke-width':2.5};
      if(dashd) at['stroke-dasharray']='7,4';
      svg.append(E('polyline',at));};
    if(f.tail_from!=null && f.tail_from>s[0][0]){
      const interp=s.filter(a=>a[0]<=f.tail_from);
      let tail=s.filter(a=>a[0]>=f.tail_from);
      const j=s.findIndex(a=>a[0]>=f.tail_from);
      if(j>0){const a=s[j-1],b=s[j],k=(f.tail_from-a[0])/(b[0]-a[0]),L=(u,v)=>u+k*(v-u);
        tail=[[f.tail_from,L(a[1],b[1]),L(a[2],b[2]),L(a[3],b[3])]].concat(tail);}
      seg(interp,false); seg(tail,true);
    } else seg(s,false);
  });
}
function drawCollapses(){
  const cs=slots();
  D.floors.forEach((f,i)=>{
    if(!(f.loss>0)) return;
    const xx=X(f.end), y1=Y(f.pre), y2=Y(f.post);
    svg.append(tipify(E('line',{x1:xx,x2:xx,y1:y1,y2:y2,stroke:'#c0392b','stroke-width':3}),
      `Floor ${f.num} collapse: ${fmt(f.pre)} → ${fmt(f.post)} (${(f.loss*100).toFixed(0)}% left behind; ${f.basis})`));
    const lbl=`−${(f.loss*100).toFixed(0)}%${f.basis=='canon'?'':' (est.)'}`, mid=(y1+y2)/2;
    const last=i==D.floors.length-1;
    const x0=last? xx-6-lbl.length*3.4 : xx+6, x1=x0+lbl.length*6.8;
    const y=cs.place(x0,x1,[mid+4,mid-12,mid+20,mid-28,mid+36]);
    if(y!=null) svg.append(E('text',{x:(x0+x1)/2,y,'text-anchor':'middle',fill:'#c0392b','font-weight':600},lbl));
  });
}
function drawViewPanel(){
  svg.append(E('text',{x:g.W/2,y:g.VIEW_T-12,'text-anchor':'middle','font-size':15,'font-weight':600},
    "Carl & Princess Donut's Viewership (Views, Followers & Favorites — Log Scale)"));
  svg.append(E('text',{transform:`translate(22,${(g.VIEW_T+g.VIEW_B)/2}) rotate(-90)`,'text-anchor':'middle'},
    'Views / Followers / Favorites'));
  for(let e=0;e<=30;e+=3){const v=Math.pow(10,e);
    if(g.vymin<=v&&v<=g.vymax){const yy=VY(v);
      svg.append(E('line',{'class':'grid',x1:g.ML,x2:g.W-g.MR,y1:yy,y2:yy}));
      svg.append(E('text',{x:g.ML-8,y:yy+4,'text-anchor':'end','class':'lbl'},short(v)));}}
  const series=[['views','#8e44ad',"Carl's Views"],['followers','#2980b9',"Carl's Followers"],
                ['favorites','#27ae60',"Carl's Favorites"],['donut_favorites','#d35400',"Donut's Favorites"]];
  series.forEach(([attr,col,label])=>{
    const pts=D.viewers.filter(v=>v[attr]!=null&&v[attr]>0).sort((a,b)=>a.t-b.t);
    if(pts.length>=2) svg.append(E('polyline',{points:pts.map(v=>X(v.t).toFixed(1)+','+VY(v[attr]).toFixed(1)).join(' '),
      fill:'none',stroke:col,'stroke-width':2.2}));
    pts.forEach(v=>{
      const f=floorAt(v.t), tipTxt=mkTip([
        `${label}: ${fmt(v[attr])} (${short(v[attr])})`,
        `a) Since Collapse: ${dur(v.t)} (T0+${v.t}h)`,
        `b) To Level Collapse: ${dur(f.end-v.t)} (Floor ${v.floor})`,
        `c) Stairs/Floors: ${stairsTxt(f,v.t)}`, v.event, `[${v.location}]`]);
      const c=E('circle',{'class':'anchor',cx:X(v.t),cy:VY(v[attr]),r:4.5,fill:col,stroke:'#fff','stroke-width':1.2});
      c.dataset.tip=tipTxt; c.style.cursor='help'; svg.append(c);});
  });
  // Event markers: viewer rows without numbers anchor calendar/narrative events on the timeline.
  D.viewers.filter(v=>v.views==null&&v.followers==null&&v.favorites==null&&v.donut_favorites==null)
   .forEach(v=>{
    const f=floorAt(v.t), tipTxt=mkTip([
      `Calendar anchor: ${v.event}`,
      `a) Since Collapse: ${dur(v.t)} (T0+${v.t}h)`,
      `b) To Level Collapse: ${dur(f.end-v.t)}`,
      `c) Stairs/Floors: ${stairsTxt(f,v.t)}`, `[${v.location}]`]);
    const xx=X(v.t);
    [[g.POP_T,g.POP_B],[g.VIEW_T,g.VIEW_B],[g.LEV_T,g.LEV_B]].forEach(([a,b])=>{
      const l=tipify(E('line',{x1:xx,x2:xx,y1:a,y2:b,stroke:'#7f8c8d','stroke-width':1.5,'stroke-dasharray':'1,3'}), tipTxt);
      svg.append(l);});
    const lbl=(v.location||'').split(',').pop()||'';
    if(lbl) svg.append(E('text',{x:xx+4,y:g.POP_T+16,'font-size':10,fill:'#7f8c8d'},lbl));
  });
}
function drawLevelPanel(){
  svg.append(E('text',{x:g.W/2,y:g.LEV_T-12,'text-anchor':'middle','font-size':15,'font-weight':600},
    'Crawler Levels vs. Time (stepped between canon level-ups)'));
  svg.append(E('text',{transform:`translate(22,${(g.LEV_T+g.LEV_B)/2}) rotate(-90)`,'text-anchor':'middle'},'Crawler level'));
  const step=[2,5,10,20,25,50].find(s=>g.levmax/s<=16)||100;
  for(let v=step;v<=g.levmax;v+=step){const yy=LY(v);
    svg.append(E('line',{'class':'grid',x1:g.ML,x2:g.W-g.MR,y1:yy,y2:yy}));
    svg.append(E('text',{x:g.ML-8,y:yy+4,'text-anchor':'end','class':'lbl'},String(v)));}
  const order=levelNames();
  const lblSlots=slots();
  order.forEach((name,i)=>{
    if(!isOn(name)) return;
    const col=D.colors[i%D.colors.length];
    const pts=D.levels.filter(l=>l.crawler==name).sort((a,b)=>a.t-b.t);
    const alive=pts.filter(a=>a.level!=null), term=pts.find(a=>a.level==null);
    if(!alive.length) return;
    const p=[alive[0]];
    for(let j=1;j<alive.length;j++){p.push({t:alive[j].t,level:alive[j-1].level});p.push(alive[j]);}
    if(p.length>1)
      svg.append(E('polyline',{points:p.map(a=>X(a.t).toFixed(1)+','+LY(a.level).toFixed(1)).join(' '),
        fill:'none',stroke:col,'stroke-width':2.5}));
    alive.forEach(a=>{
      const f=floorAt(a.t), tipTxt=mkTip([
        `${a.crawler} — Level ${a.level}`,
        `a) Since Collapse: ${dur(a.t)} (T0+${a.t}h)`,
        `b) To Level Collapse: ${dur(f.end-a.t)}`,
        `c) Stairs/Floors: ${stairsTxt(f,a.t)}`, a.event, `[${a.qualifier} — ${a.cite}]`]);
      const c=E('circle',{'class':'anchor',cx:X(a.t),cy:LY(a.level),r:4.5,fill:col,stroke:'#fff','stroke-width':1.2});
      c.dataset.tip=tipTxt; c.style.cursor='help'; svg.append(c);});
    if(term && term.t<=zt1){
      const f=floorAt(term.t), tipTxt=mkTip([
        `${term.crawler} — ${term.kind=='exit'?'leaves the dungeon':'dies'}`,
        `a) Since Collapse: ${dur(term.t)} (T0+${term.t}h)`,
        `b) To Level Collapse: ${dur(f.end-term.t)}`,
        `c) Stairs/Floors: ${stairsTxt(f,term.t)}`, term.event, `[${term.qualifier} — ${term.cite}]`]);
      const dy=LY(alive[alive.length-1].level), dxx=X(term.t);
      let mk;
      if(term.kind=='exit'){
        mk=E('text',{'class':'anchor',x:dxx.toFixed(1),y:(dy+5).toFixed(1),'text-anchor':'middle',
          fill:col,'font-weight':700,'font-size':15},'!');
      } else {
        mk=E('path',{'class':'anchor',d:`M${dxx-5},${dy-5} l10,10 M${dxx-5},${dy+5} l10,-10`,
          stroke:col,'stroke-width':2.5,fill:'none'});
      }
      mk.dataset.tip=tipTxt; mk.style.cursor='help'; svg.append(mk);}
    const last=alive[alive.length-1], y0=LY(last.level), lastX=X(last.t),
          nameW=name.length*6.4, rightX=g.W-g.MR-8;
    let placed=false;
    if(term && lastX+nameW+30<rightX){
      const x0=lastX+8, x1=Math.min(lastX+8+nameW,rightX);
      const y=lblSlots.place(x0,x1,[y0+4,y0-12,y0+20,y0-28,y0+36]);
      if(y!=null){svg.append(E('text',{x:x0,y,fill:col,'font-weight':600},name));placed=true;}
    }
    if(!placed){
      const x1=rightX, x0=x1-nameW;
      const y=lblSlots.place(x0,x1,[y0+4,y0-12,y0+20,y0-28,y0+36]);
      if(y!=null) svg.append(E('text',{x:x1,y,'text-anchor':'end',fill:col,'font-weight':600},name));
    }
  });
}
function drawPopAnchors(){
  D.anchors.forEach(a=>{
    const f=floorAt(a.t), exact=a.qualifier=='exact';
    const tipTxt=mkTip([
      `${fmt(a.count)}${exact?'':' ('+a.qualifier+')'} — Floor ${a.floor}`,
      `a) Since Collapse: ${dur(a.t)} (T0+${a.t}h)`,
      `b) To Level Collapse: ${dur(f.end-a.t)}`,
      `c) Stairs/Floors: ${stairsTxt(f,a.t)}`, a.event, `[${a.cite}]`]);
    let e;
    if(a.phase=='entered')
      e=E('path',{'class':'anchor',d:`M${X(a.t).toFixed(1)},${(Y(a.count)-7).toFixed(1)} l7,7 l-7,7 l-7,-7z`,fill:'#999'});
    else if(a.phase=='obs'){
      const est=at(a.t,a.floor), yy=Y(est?est.c:a.count);
      e=E('polygon',{'class':'anchor',
        points:`${X(a.t).toFixed(1)},${(yy-7).toFixed(1)} ${(X(a.t)+6).toFixed(1)},${(yy+5).toFixed(1)} ${(X(a.t)-6).toFixed(1)},${(yy+5).toFixed(1)}`,
        fill:'#e67e22',stroke:'#1f2d3d','stroke-width':1.5});
    } else
      e=E('circle',{'class':'anchor',cx:X(a.t),cy:Y(a.count),r:5,fill:exact?'#1f2d3d':'#fff',stroke:'#1f2d3d','stroke-width':2});
    e.dataset.tip=tipTxt; e.style.cursor='help'; svg.append(e);});
}
function drawLegends(){
  const lx=g.W-g.MR-310, ly=g.POP_T+36;

      ...(dash?{'stroke-dasharray':dash}:{})}));
    else if(kind=='tri') svg.append(E('polygon',{points:`${lx+25},${yy-5} ${lx+31},${yy+5} ${lx+19},${yy+5}`,fill:col,stroke:'#1f2d3d'}));
    else svg.append(E('circle',{cx:lx+25,cy:yy,r:5,fill:col}));

  const vitems=[['#8e44ad',"Carl's Views"],['#2980b9',"Carl's Followers"],

  vitems.forEach(([col,label],i)=>{const yy=vy+16+i*18;
    svg.append(E('line',{x1:vx+10,x2:vx+36,y1:yy,y2:yy,stroke:col,'stroke-width':2.5}));
    svg.append(E('circle',{cx:vx+23,cy:yy,r:4,fill:col}));
    svg.append(E('text',{x:vx+44,y:yy+4},label));});
  // Crawler series key lives in the HTML #lkey bar (outside the SVG), not here.
}
function makeHoverLayer(){
  const layer=E('g',{id:'hover-layer','pointer-events':'none'});
  vline=E('line',{stroke:'#333','stroke-dasharray':'3,3',x1:0,x2:0,y1:g.POP_T,y2:g.POP_B,style:'display:none'});
  vdot=E('circle',{r:6,fill:'#ffd23f',stroke:'#333',cx:-99,cy:-99,style:'display:none'});
  selRect=E('rect',{fill:'#4c78a8','fill-opacity':.15,stroke:'#4c78a8','stroke-width':1,display:'none'});
  layer.append(vline,vdot); svg.append(layer); svg.append(selRect);
}
// ----------------------------------------------------------------- zoom --
function zoomSet(a,b){
  zt0=Math.max(0,a); zt1=Math.min(g.tmax,b);
  if(zt1-zt0<0.05){const m=(zt0+zt1)/2; zt0=m-0.025; zt1=m+0.025;}
  document.getElementById('zt0').value=Math.round(zt0*100)/100;
  document.getElementById('zt1').value=Math.round(zt1*100)/100;
  renderAll(); lookup();
}
function zoomReset(){zoomSet(0,g.tmax);}
function zoomApply(){const a=+document.getElementById('zt0').value,b=+document.getElementById('zt1').value;
  if(!isNaN(a)&&!isNaN(b)) zoomSet(a,b);}
function zoomStep(k){const m=(zt0+zt1)/2,half=(zt1-zt0)*k/2; zoomSet(m-half,m+half);}
function zoomShift(d){const w=zt1-zt0; zoomSet(zt0+w*d,zt1+w*d);}
const fb=document.getElementById('fbtns');
D.floors.forEach(f=>{const b=document.createElement('button'); b.type='button'; b.textContent='F'+f.num;
  b.onclick=()=>{const w=Math.max(f.end-f.start,1); zoomSet(f.start-w*0.05, f.end+w*0.05);}; fb.append(b);});
// ---------------------------------------------------------------- hover --
let drag0=null;
function svPt(e){const r=svg.getBoundingClientRect();
  return {x:(e.clientX-r.left)*g.W/r.width, y:(e.clientY-r.top)*g.H/r.height};}
function levelAt(t,name){const s=D.levels.filter(l=>l.crawler==name&&l.t<=t&&l.level!=null);
  return s.length?s[s.length-1].level:null;}
function show(e){
  const p=svPt(e), r=svg.getBoundingClientRect();
  const an=e.target.closest&&e.target.closest('.anchor');
  if(an){vline.style.display=vdot.style.display='none'; tip.innerHTML=an.dataset.tip; tip.style.display='block';
    const ax=e.clientX-r.left;
    tip.style.left=(ax+(ax>r.width*0.7?-tip.offsetWidth-14:14))+'px';
    tip.style.top=(e.clientY-r.top-20)+'px'; return;}
  const t=TP(p.x);
  const inPop=p.x>=g.ML&&p.x<=g.W-g.MR&&p.y>=g.POP_T&&p.y<=g.POP_B;
  const inLev=p.x>=g.ML&&p.x<=g.W-g.MR&&p.y>=g.LEV_T&&p.y<=g.LEV_B;
  if(inPop){
    const v=(t>=0&&t<=g.tmax)?at(t):null;
    if(v){vline.style.display=vdot.style.display='';
      vline.setAttribute('x1',X(t));vline.setAttribute('x2',X(t));
      vdot.setAttribute('cx',X(t));vdot.setAttribute('cy',Y(v.c));
      tip.innerHTML=`<b>Floor ${v.f.num}</b> · a) Since Collapse: ${dur(t)} (T0+${t.toFixed(1)}h)<br>`+
        `b) To Level Collapse: ${dur(v.f.end-t)} · c) ${stairsTxt(v.f,t)}<br>`+
        `<b>${fmt(v.c)}</b> crawlers<br><span style="opacity:.8">range ${fmt(v.lo)} – ${fmt(v.hi)}`+
        `${v.extrap?'<br>(extrapolated)':''}</span>`;
      tip.style.display='block';
      const tx=X(t)*r.width/g.W; tip.style.left=(tx+(tx>r.width*0.7?-tip.offsetWidth-14:14))+'px';
      tip.style.top=(Y(v.c)*r.height/g.H-20)+'px'; return;}
  } else if(inLev){
    const names=levelNames().filter(isOn);
    const rows=names.map(n=>{const l=levelAt(t,n); return n+': <b>'+(l!=null?'Level '+l:'—')+'</b>';});
    if(rows.length){vline.style.display=vdot.style.display='none';
      tip.innerHTML=`<b>T0+${t.toFixed(1)}h</b> (${dur(t)})<br>`+rows.join('<br>');
      tip.style.display='block';
      const ax=e.clientX-r.left;
      tip.style.left=(ax+(ax>r.width*0.7?-tip.offsetWidth-14:14))+'px';
      tip.style.top=(e.clientY-r.top-20)+'px'; return;}
  }
  tip.style.display='none'; vline.style.display=vdot.style.display='none';
}
svg.addEventListener('mousemove',e=>{
  if(drag0){const p=svPt(e);
    selRect.setAttribute('x',Math.min(drag0.x,p.x)); selRect.setAttribute('width',Math.abs(p.x-drag0.x));
    selRect.setAttribute('y',g.POP_T); selRect.setAttribute('height',g.LEV_B-g.POP_T);
    selRect.setAttribute('display','');}
  show(e);});
svg.addEventListener('mousedown',e=>{drag0=svPt(e);});
svg.addEventListener('mouseleave',()=>{tip.style.display='none';
  if(vline){vline.style.display=vdot.style.display='none';} if(drag0){drag0=null;selRect.setAttribute('display','none');}});
window.addEventListener('mouseup',e=>{
  if(!drag0) return; const p=svPt(e);
  if(Math.abs(p.x-drag0.x)>8) zoomSet(TP(Math.min(drag0.x,p.x)), TP(Math.max(drag0.x,p.x)));
  drag0=null; selRect.setAttribute('display','none');});
svg.addEventListener('dblclick',zoomReset);
// -------------------------------------------------------------- lookups --
const sel=document.getElementById('fl'); D.floors.forEach(f=>sel.add(new Option(f.num,f.num)));
function lookup(){
  const f=D.floors.find(f=>f.num==sel.value), mode=document.getElementById('mode').value, h=parseDur(document.getElementById('val').value);
  const out=document.getElementById('out'); if(isNaN(h)){out.textContent='Could not parse time (try 40, 3d14h).';return;}
  const t = mode=='into'? f.start+h : mode=='rem'? f.end-h : h;
  const v=at(t,f.num); if(!v){out.textContent=`That time is outside Floor ${f.num} (T0+${f.start}h – T0+${f.end}h).`;return;}
  out.innerHTML=`Floor ${f.num} · a) Since Collapse: ${dur(t)} (T0+${t.toFixed(2)}h) · b) To Collapse: ${dur(f.end-t)} · c) ${stairsTxt(f,t)}: `+
   `<b>${fmt(v.c)}</b> crawlers (range ${fmt(v.lo)} – ${fmt(v.hi)})${v.extrap?' — extrapolated':''}`;
}
const tb=document.getElementById('summary');
tb.innerHTML='<tr><th>Floor</th><th>Window</th><th>Opens with</th><th>Just before collapse</th><th>After collapse</th><th>Left behind</th><th class="l">Collapse basis</th></tr>'+
 D.floors.map(f=>`<tr><td>${f.num}</td><td>T0+${f.start}h – T0+${f.end}h</td><td>${fmt(f.open)}</td><td>${fmt(f.pre)}</td><td>${fmt(f.post)}</td><td>${(f.loss*100).toFixed(1)}%</td><td class="l">${f.basis}</td></tr>`).join('');
zoomReset();
</script></body></html>
